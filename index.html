<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="">

  <meta property="og:title" content="">

  <meta property="og:url" content="">

<body>

  <!-- Add your site or application content here -->
  <p class="title">Meals & Meal Category</p>
  <div class="wrapper">
    <!--List of Category -->
    <div class="set1">
      <p class="info">Please find the list of Categories below!!!</p>
      <button class="lClass" id="mealCatList">Meal Category List</button>
      <div class = "output" id = "output1"></div>
    </div>

    <!--Filtered Category -->
    <div class="set2">
      <p class="info">Please find the meal available with your chosen category!</p>
      <input type="text" class="text" id="catName" placeholder="Category name...">
      <button class="fClass" id="mealCat">Meal Category</button>
      <div class="mealS" id="mealSec"></div>
    </div>
  </div>
  <!-- Popup Modal -->
  <div id="popupModal" class="popup-modal">
    <div class="popup-content">
      <span id="closePopup" class="close-btn">&times;</span>
      <h2 id="popupTitle"></h2>
      <p id="popupText"></p>
    </div>
  </div>

  <script src="js/app.js"></script>

</body>
